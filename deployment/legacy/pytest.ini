[tool:pytest]
# BookBuilder Test Configuration

# Test discovery
testpaths = legacy/tests
pythonpath = legacy legacy/core legacy/web
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test execution
addopts = 
    --verbose
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes
    -ra

# Custom markers for test categorization
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    chess: marks tests as chess-specific functionality tests
    performance: marks tests as performance tests
    edge_case: marks tests as edge case tests
    network: marks tests that require network access
    engine: marks tests that require chess engine
    
# Minimum version requirements
minversion = 6.0

# Test timeout (prevent hanging tests)
timeout = 300

# Coverage settings (if pytest-cov is installed)
# addopts = --cov=app --cov=config --cov-report=html --cov-report=term

# Parallel execution (if pytest-xdist is installed)
# addopts = -n auto

# Filter warnings
filterwarnings =
    ignore::UserWarning
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning