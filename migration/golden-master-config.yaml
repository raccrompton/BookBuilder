#GOLDEN MASTER TEST CONFIGURATION
#This config is specifically for extracting golden master data for TDD validation

#BOOK SETTINGS - Test Openings
OPENINGBOOK: [
  {"Name": "Ruy_Lopez", "pgn": "1. e4 e5 2. Nf3 Nc6 3. Bb5"},
  {"Name": "Kings_Indian", "pgn": "1. d4 Nf6 2. c4 g6 3. Nc3 Bg7 4. e4 d6"}
]
#Ruy Lopez: 1. e4 e5 2. Nf3 Nc6 3. Bb5 (White's perspective - odd moves)
#King's Indian Defense: 1. d4 Nf6 2. c4 g6 3. Nc3 Bg7 4. e4 d6 (Black's perspective - even moves)

LONGTOSHORT: 0
#Keep short to long for consistent test ordering

#DATABASE SETTINGS - Minimal for fast golden master extraction
VARIANT: 'standard'
SPEEDS: ['blitz,rapid,classical']
RATINGS: ['1800,2000,2200']
MOVES: 8
#Reduced from 10 to 8 for faster golden master extraction

#MOVE SELECTION SETTINGS - Relaxed for broader test coverage
DEPTHLIKELIHOOD: 0.05
#Slightly higher (less deep) than production for faster golden master generation
ALPHA: 0.001
MINPLAYRATE: 0.005
#Slightly higher threshold for cleaner test data
MINGAMES: 15
#Reduced from 19 for more test data
CONTINUATIONGAMES: 8
#Reduced from 10 for more test data
DRAWSAREHALF: 0
#Standard setting for consistent test data

#ENGINE SETTINGS - Disabled for golden master extraction
CAREABOUTENGINE: 0
#Disable engine for fast, deterministic golden master data
ENGINEDEPTH: 15
ENGINEFINISH: 0
#No engine finishing for clean test data
SOUNDNESSLIMIT: -99
MOVELOSSLIMIT: -99
IGNORELOSSLIMIT: 300
ENGINETHREADS: 1
ENGINEHASH: 128

# Enable detailed output for golden master verification
PRINT_INFO_TO_CONSOLE: true